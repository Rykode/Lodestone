name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The GitHub runner already has the Android SDK. Accept its licences and add the platform this app compiles against.
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug build
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lodestone-debug
          path: app/build/outputs/apk/debug/*.apk
