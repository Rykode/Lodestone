name: Release

# Push a tag such as v1.0.0 to build the release APK and attach it to a GitHub release.
# To sign it, add these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the keystore file, base64 encoded
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the APK is built unsigned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The GitHub runner already has the Android SDK. Accept its licences and add the platform this app compiles against.
      - name: Install the SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/signing/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$RUNNER_TEMP/signing/keystore.properties"
            echo "LODESTONE_SIGNING_DIR=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Release build
        run: ./gradlew assembleRelease
      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Lodestone-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: CHANGELOG.md
